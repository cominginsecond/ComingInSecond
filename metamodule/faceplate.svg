<?xml version="1.0" encoding="UTF-8"?>
<!-- MetaModule-only faceplate (the VCV build uses res/QuantizerSequencer.svg).
     make-assets.sh renders this to assets/QuantizerSequencer.png. Labels are drawn in code. -->
<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="128.5mm" viewBox="0 0 101.6 128.5">
  <!-- light gray body -->
  <rect x="0" y="0" width="101.6" height="128.5" fill="#d4d4d4"/>
  <!-- rule under the title, in the title's dark blue -->
  <rect x="4" y="10.6" width="93.6" height="0.45" fill="#0b3a8c"/>
  <!-- black panels for the bottom row: step controls, quantizer inputs, output -->
  <rect x="3.5" y="84" width="49" height="24" rx="2" fill="#000000" stroke="#5a5a5a" stroke-width="0.4"/>
  <rect x="54" y="84" width="24" height="24" rx="2" fill="#000000" stroke="#5a5a5a" stroke-width="0.4"/>
  <rect x="79.5" y="84" width="19" height="24" rx="2" fill="#262626" stroke="#ffffff" stroke-width="0.4"/>
</svg>
