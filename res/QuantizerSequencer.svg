<?xml version="1.0" encoding="UTF-8"?>
<!-- 20HP panel: 101.6mm x 128.5mm. Labels and keys are drawn in code (Rack's SVG renderer ignores <text>). -->
<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="128.5mm" viewBox="0 0 101.6 128.5">
  <rect x="0" y="0" width="101.6" height="128.5" fill="#000000"/>
  <!-- rule under the title -->
  <rect x="4" y="10.6" width="93.6" height="0.35" fill="#ffffff"/>
  <!-- step controls: clock, reset, length, scale select -->
  <rect x="3.5" y="84" width="49" height="24" rx="2" fill="none" stroke="#5a5a5a" stroke-width="0.4"/>
  <!-- quantizer inputs: cv, s&h -->
  <rect x="54" y="84" width="24" height="24" rx="2" fill="none" stroke="#5a5a5a" stroke-width="0.4"/>
  <!-- output -->
  <rect x="79.5" y="84" width="19" height="24" rx="2" fill="#262626" stroke="#ffffff" stroke-width="0.4"/>
</svg>
