<?xml version="1.0" encoding="UTF-8"?>
<!-- 18HP panel: 91.44mm x 128.5mm. Labels and keys are drawn in code (Rack's SVG renderer ignores <text>). -->
<svg xmlns="http://www.w3.org/2000/svg" width="91.44mm" height="128.5mm" viewBox="0 0 91.44 128.5">
  <rect x="0" y="0" width="91.44" height="128.5" fill="#e8e4dc"/>
  <!-- title bar -->
  <rect x="0" y="0" width="91.44" height="11" fill="#2b2f36"/>
  <!-- keyboard section -->
  <rect x="3" y="12" width="85.44" height="62" rx="2" fill="#d8d3c8"/>
  <!-- inputs -->
  <rect x="3" y="86" width="63" height="24" rx="2" fill="#d8d3c8"/>
  <!-- output -->
  <rect x="68" y="86" width="20.44" height="24" rx="2" fill="#2b2f36"/>
  <!-- footer -->
  <rect x="0" y="118" width="91.44" height="10.5" fill="#2b2f36"/>
</svg>
