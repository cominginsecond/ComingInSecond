<?xml version="1.0" encoding="UTF-8"?>
<!-- MetaModule-only knob face: brushed silver with a black pointer (VCV uses a stock knob).
     The MetaModule rotates this image, so the pointer is drawn at 12 o'clock. -->
<svg xmlns="http://www.w3.org/2000/svg" width="9mm" height="9mm" viewBox="0 0 9 9">
  <defs>
    <!-- light from the top left, falling off to darker steel at the bottom right -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c8ccd0"/>
      <stop offset="1" stop-color="#6c7176"/>
    </linearGradient>
    <linearGradient id="cap" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2f4f6"/>
      <stop offset="0.55" stop-color="#b9bdc2"/>
      <stop offset="1" stop-color="#8e9399"/>
    </linearGradient>
  </defs>
  <circle cx="4.5" cy="4.5" r="4.35" fill="url(#rim)" stroke="#2a2a2a" stroke-width="0.3"/>
  <circle cx="4.5" cy="4.5" r="3.1" fill="url(#cap)" stroke="#5d6166" stroke-width="0.2"/>
  <rect x="4.05" y="0.55" width="0.9" height="3.6" rx="0.3" fill="#000000"/>
</svg>
